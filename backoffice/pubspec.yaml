name: poblex_backoffice
description: Backoffice web municipal de Poblex.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  get_it: ^9.2.1
  dio: ^5.11.0
  go_router: ^17.4.0
  equatable: ^2.1.0
  intl: any
  # Browser APIs used by the attachment picker. Kept behind a conditional
  # import so widget tests and non-web tooling remain portable.
  web: ^1.1.1
  poblex_design_system:
    path: ../packages/poblex_design_system
  # Miniaturas de la galería de fotos de comercios en el editor.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
